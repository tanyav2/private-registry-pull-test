# Regression check for private-registry pulls: the image below is private on
# GHCR and is only reachable with the organization's registry credential.
cvm-version: 0.14.8
cpus: 2
memory: 8192

containers:
  - name: "app"
    image: "ghcr.io/tanyav2/simple-container-private@sha256:d699a189a47c0cabfe42f89f41bc99e4d7c43ba47c4efca8b3ec5df4a991510d"

shim:
  upstream-port: 8000
  paths:
    - /*
